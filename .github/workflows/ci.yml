name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # riskell targets macOS 14+ on Apple silicon (Package.swift); the runner is macOS 15.
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (release)
        run: swift build -c release

      - name: Extension tooling (the CLI and the example)
        run: |
          swift build -c release --product riskell-ext
          .build/release/riskell-ext validate Examples/load-ext
          (cd Examples/load-ext && swift build)

      - name: Installer self-test and the checks that need no window
        run: |
          swift build -c release --product riskell-setup
          .build/release/riskell-setup --self-test
          scripts/store-check.sh
          .build/release/riskell --weather-selftest
          scripts/listings-check.sh

      - name: Scrub check (no personal data in tracked files)
        run: scripts/scrub-check.sh
