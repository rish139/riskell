name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # riskell targets macOS 14+ on Apple silicon (Package.swift); the runner is macOS 15.
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build (release)
        run: swift build -c release

      # the window managers' wire formats, replayed from Tests/RiskellWMTests/fixtures: no window manager runs here (Tests/wm/README.md)
      - name: Unit tests
        run: swift test

      - name: Extension tooling (the CLI and the example)
        run: |
          swift build -c release --product riskell-ext
          .build/release/riskell-ext validate Examples/load-ext
          (cd Examples/load-ext && swift build)

      # an optional first-party extension, checked with the validator any extension author runs and with its own tests (a model of AeroSpace's
      # tiling tree: no window manager runs here)
      - name: The dwindle-aerospace extension
        run: |
          .build/release/riskell-ext validate Packages/dwindle-aerospace
          (cd Packages/dwindle-aerospace && swift test)

      - name: Installer self-test and the checks that need no window
        run: |
          swift build -c release --product riskell-setup
          .build/release/riskell-setup --self-test
          scripts/store-check.sh
          .build/release/riskell --weather-selftest
          scripts/listings-check.sh

      # the JSON the CLI prints is a contract (schemas/), and three of its screens are recorded (Tests/cli/golden): Tests/cli/README.md
      # a ported extension must say what it came from, and each way of leaving that claim incomplete has a fixture (rule manifest.derived-from)
      - name: Provenance rule
        run: Tests/registry/derived-from.sh
      - name: CLI contracts and golden screens
        run: Tests/cli/contract.sh

      - name: Scrub check (no personal data in tracked files)
        run: scripts/scrub-check.sh
