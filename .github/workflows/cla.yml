name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
    # the Apache-2.0 parts take contributions on Apache-2.0's own terms (section 5): no CLA is asked for them
    paths-ignore:
      - 'Sources/riskell-ext/**'
      - 'schemas/**'
      - 'Examples/**'

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Dependabot's pull requests run with a read-only token: the allowlist already covers it, and the check cannot post a status for it
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check that contributors have signed the CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # pinned to a commit: contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/rish139/riskell/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'rish139,dependabot[bot]'
